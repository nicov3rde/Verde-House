services:
  - type: web
    name: verde-clip
    runtime: python
    rootDir: .
    buildCommand: |
      pip install -r backend/requirements.txt &&
      cd frontend && npm ci && npm run build
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CLIP_BOT_DIR
        value: /opt/render/project/src/clip-bot
      - key: DATA_DIR
        value: /opt/render/project/src/consumer-app/backend/data
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: verde-clip-data
      mountPath: /opt/render/project/src/consumer-app/backend/data
      sizeGB: 10
